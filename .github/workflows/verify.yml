name: Verify server deployment and APK
on:
  pull_request:
  push:
    branches: [main, fix/server-nav-four-tabs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: SBQB Required Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Reproduce and check the actual VPS build
        run: python3 deploy/verify-bundled-production.py
      - run: node scripts/verify-android-bridge.mjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Build and verify Android package
        run: gradle -p android --no-daemon assembleRelease assembleDebug testDebugUnitTest lintRelease
      - uses: actions/upload-artifact@v7
        with:
          name: dewu-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: dewu-debug-acceptance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
