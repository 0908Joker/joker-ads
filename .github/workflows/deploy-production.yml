name: Deploy verified production release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-production.yml
      - 'admin/**'
      - 'src/**'
      - 'scripts/test-*.mjs'
      - 'deploy/**'
      - package.json
      - package-lock.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: joker-ads-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://b12sl5x.cn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci --prefix admin --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Security and payment isolation regression
        run: node scripts/test-audit-security.mjs
      - name: Exercise real admin add/edit/delete/publish APIs
        run: node scripts/test-ad-sync.mjs
      - name: Atomic snapshot fault and interruption regression
        run: node scripts/test-audit-config.mjs
      - name: Reproduce exact production build
        env:
          AUDIT_BUNDLE_OUT: ${{ runner.temp }}/audit-release
        run: python3 deploy/verify-bundled-production.py
      - name: Execute exact patched player race regression
        env:
          AUDIT_BUNDLE_OUT: ${{ runner.temp }}/audit-release
        run: node scripts/test-audit-runtime.mjs
      - name: Deploy through restricted production key
        env:
          DEPLOY_KEY: ${{ secrets.AD_SYNC_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.AD_SYNC_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ad-sync-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/ad-sync-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ad-sync-ssh/known_hosts"
          ssh -i "$RUNNER_TEMP/ad-sync-ssh/id_ed25519" -p 32356 \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ad-sync-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            root@107.149.129.35 "$GITHUB_SHA"
      - name: Verify public deployment receipt
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const response = await fetch('https://b12sl5x.cn/deployment.json?v=' + Date.now())
          assert.equal(response.status, 200)
          const receipt = await response.json()
          assert.equal(receipt.revision, process.env.EXPECTED_REVISION)
          assert.equal(receipt.status, 'verified')
          const fs = await import('node:fs')
          const local = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/audit-release/manifest.json'))
          assert.equal(receipt.frontendSha256, local.frontendSha256)
          for (const file of local.files) assert.equal(receipt.files.find(f => f.target === file.target)?.sha256, file.sha256, file.target)
          console.log(receipt)
          JS
      - name: Remove runner key files
        if: always()
        run: rm -f "$RUNNER_TEMP/ad-sync-ssh/id_ed25519" "$RUNNER_TEMP/ad-sync-ssh/known_hosts"
