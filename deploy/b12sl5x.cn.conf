server
{
    listen 80;
    server_name b12sl5x.cn www.b12sl5x.cn;
    index index.html;
    root /www/wwwroot/b12sl5x.cn;

    # 证书申请验证目录（certbot HTTP-01）
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/b12sl5x.cn;
        allow all;
    }

    # 接口/媒体/支付代理，与 al-ads.com 共用同一份配置
    include /www/server/panel/vhost/nginx/extension/seduoduo.cc/ads-king-proxy.conf;

    # 构建产物文件名带 hash，可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|geb|ceb)$ {
        expires 30d;
        access_log off;
    }

    # index.html 绝不能缓存，否则用户会拿着旧的文件名去请求已删除的 assets
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # 单页应用：未知路径一律回 index.html 交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_vary on;

    access_log  /www/wwwlogs/b12sl5x.cn.log;
    error_log   /www/wwwlogs/b12sl5x.cn.error.log;
}
