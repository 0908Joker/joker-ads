server
{
    listen 80;
    server_name admin.b12sl5x.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/b12sl5x.cn;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/admin.b12sl5x.cn.log;
    error_log  /www/wwwlogs/admin.b12sl5x.cn.error.log;
}

server
{
    listen 443 ssl;
    http2 on;
    server_name admin.b12sl5x.cn;

    ssl_certificate     /etc/letsencrypt/live/admin.b12sl5x.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.b12sl5x.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/b12sl5x.cn;
        allow all;
    }

    # Site assets used by admin previews (icons / popups / promo)
    location /icons/ {
        alias /www/wwwroot/b12sl5x.cn/icons/;
        expires 7d;
        access_log off;
    }
    location /popups/ {
        alias /www/wwwroot/b12sl5x.cn/popups/;
        expires 7d;
        access_log off;
    }
    location /promo/ {
        alias /www/wwwroot/b12sl5x.cn/promo/;
        expires 7d;
        access_log off;
    }
    location /uploads/ {
        alias /opt/ads-king/uploads/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 12m;
    }

    access_log /www/wwwlogs/admin.b12sl5x.cn.log;
    error_log  /www/wwwlogs/admin.b12sl5x.cn.error.log;
}
