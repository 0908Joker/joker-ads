# API reverse proxy for ads-king (clean egress IP)
# Do NOT forward client IP — origin bans via X-Forwarded-For / X-Real-IP (errorCode 1067).
# Strip upstream CORS — duplicate ACAO (* + site) breaks browser fetch.
# Upstream IPs are pinned in ads-king-upstream.conf (CDN DNS returns dead nodes).
location /api-proxy/ {
    proxy_pass https://ads_king_deuwy/api/v1/;
    proxy_ssl_server_name on;
    proxy_ssl_name deuwy.jcd9nw.com;
    proxy_ssl_verify off;
    proxy_set_header Host deuwy.jcd9nw.com;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept $http_accept;
    proxy_pass_request_headers on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_504;
    proxy_buffering off;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Request-Headers;
    proxy_hide_header Vary;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Headers "Accept,Content-Type,token,t,k,Authorization" always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS,HEAD" always;
    add_header Access-Control-Expose-Headers "*" always;
    add_header Vary Origin always;

    if ($request_method = OPTIONS) {
        return 204;
    }
}

location = /api-proxy {
    return 301 /api-proxy/;
}

# HLS / media URL proxy: /m3u8-proxy?url=https%3A%2F%2F...
location = /m3u8-proxy {
    resolver 8.8.8.8 ipv6=off valid=300s;
    resolver_timeout 5s;
    if ($arg_url = "") { return 400; }
    set $upstream_url $arg_url;
    proxy_pass $upstream_url;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_connect_timeout 15s;
    proxy_read_timeout 120s;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Vary;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Headers "Accept,Range,Content-Type" always;
    add_header Access-Control-Allow-Methods "GET,OPTIONS,HEAD" always;
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range,Accept-Ranges" always;
    add_header Vary Origin always;

    if ($request_method = OPTIONS) {
        return 204;
    }
}
